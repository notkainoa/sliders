name: Sliders
options:
  bundleIdPrefix: me.kainoa
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.20.2
    # Sparkle compares CFBundleVersion, not the marketing string — tying them
    # together means the CI's MARKETING_VERSION override feeds both, and a
    # static build number can never silently disable updates.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true
    # The local-build marker script edits the built Info.plist.
    ENABLE_USER_SCRIPT_SANDBOXING: false
    DEAD_CODE_STRIPPING: true
  configs:
    Release:
      # Size-tuned: the only hot path is trivial float math in the IO proc,
      # -Osize costs it nothing. Strip runs inside xcodebuild before signing;
      # release.yml verifies the symbol table is actually gone.
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      DEPLOYMENT_POSTPROCESSING: true
      STRIP_INSTALLED_PRODUCT: true
      STRIP_STYLE: all

targets:
  Sliders:
    type: application
    platform: macOS
    sources: [Sliders]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.kainoa.sliders
        INFOPLIST_FILE: Sliders/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sliders/Resources/Sliders.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle
      # Loaded by /usr/bin/perl at runtime, never linked into the app.
      - target: SlidersMediaRemote
        link: false
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    # Local builds show "local" in the menu header instead of the release
    # number they were forked from. Stamps only the display string — the
    # numeric CFBundleVersion stays, so Sparkle's comparison is untouched.
    # CI (GitHub Actions sets CI=true) is left alone.
    postBuildScripts:
      - name: Mark local build
        # Same path as input and output marks this a mutation of the built
        # plist: ordered after Info.plist processing, before code signing.
        # Either alone breaks — input-only let the stamp land post-signing
        # (invalid seal), output-only let plist processing overwrite it.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          # A mutating task must also produce a non-mutable node, or the
          # build graph rejects it ("no other virtual output node").
          - $(DERIVED_FILE_DIR)/local-build-mark
        script: |
          if [ "${CI:-}" != "true" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString local" \
              "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          fi
          touch "$DERIVED_FILE_DIR/local-build-mark"
    entitlements:
      path: Sliders/Resources/Sliders.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.network.client: true
        # Sparkle's sandboxed-install path: the app talks to its Installer
        # XPC service over these mach names. Literal bundle id, not
        # $(PRODUCT_BUNDLE_IDENTIFIER) — release.yml re-signs with raw
        # codesign, which does not expand build settings.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - me.kainoa.sliders-spks
          - me.kainoa.sliders-spki
        # Browser tab scanning (NowPlaying/BrowserTabScanner.swift) and media
        # app control (NowPlaying/ScriptedPlayer.swift). The sandbox drops
        # Apple Events to any app not listed here; keep in sync with
        # BrowserFlavor.supported and ScriptedPlayer.supported (a unit test
        # checks).
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.spotify.client
          - com.apple.Music
          - com.apple.TV
          - com.apple.Safari
          - com.apple.SafariTechnologyPreview
          - com.google.Chrome
          - com.google.Chrome.beta
          - com.google.Chrome.canary
          - org.chromium.Chromium
          - com.brave.Browser
          - com.microsoft.edgemac
          - com.vivaldi.Vivaldi
          - com.operasoftware.Opera
          - company.thebrowser.Browser
          - company.thebrowser.dia
          - net.imput.helium
          - ai.perplexity.comet

  # Now-playing helper: /usr/bin/perl dlopens it to reach MediaRemote, which
  # refuses non-Apple processes since macOS 15.4 (see SlidersMediaRemote.m).
  SlidersMediaRemote:
    type: library.dynamic
    platform: macOS
    sources: [SlidersMediaRemote]
    settings:
      base:
        PRODUCT_NAME: SlidersMediaRemote
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: true
        OTHER_LDFLAGS: -framework Foundation
        SKIP_INSTALL: true
        LD_DYLIB_INSTALL_NAME: "@rpath/libSlidersMediaRemote.dylib"
      configs:
        Release:
          # perl finds the entry point by name; a full strip would remove it.
          STRIP_STYLE: non-global

  # Hostless unit tests: pure-logic sources are compiled into the bundle
  # directly, so no app process needs to launch (LSUIElement hosts hang
  # the test runner).
  SlidersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Hand-listed on purpose (a glob would silently pull HAL-importing
      # files in) — extracting a new pure-logic source? Add it here too.
      - Tests
      - Sliders/Audio/VolumeStore.swift
      - Sliders/Audio/DeviceUsageStore.swift
      - Sliders/Audio/DevicePriorityStore.swift
      - Sliders/Audio/JSONDefaults.swift
      - Sliders/Audio/DeviceSymbol.swift
      - Sliders/Audio/AudioDevice.swift
      - Sliders/Audio/AudioApp.swift
      - Sliders/Audio/DevicePriorityPolicy.swift
      - Sliders/Audio/MultiOutputPolicy.swift
      - Sliders/Audio/VolumeTaper.swift
      - Sliders/Audio/TapMix.swift
      - Sliders/Audio/MicMutePolicy.swift
      # Property wrappers and AudioDirection; nothing in the tests touches
      # a live HAL.
      - Sliders/Audio/HALProperty.swift
      - Sliders/NowPlaying/NowPlayingSession.swift
      - Sliders/NowPlaying/NowPlayingSelection.swift
      - Sliders/NowPlaying/BrowserTabScanner.swift
      - Sliders/NowPlaying/TabProbePlanner.swift
      - Sliders/NowPlaying/ScriptedPlayer.swift
      - Sliders/NowPlaying/PlaybackRoute.swift
      - Sliders/UI/AppsListOrder.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  Sliders:
    build:
      targets:
        Sliders: all
    test:
      targets:
        - SlidersTests
